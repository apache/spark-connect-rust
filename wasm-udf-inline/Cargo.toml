# Single-file WASM UDF example: the UDF *and* the client live in `src/main.rs`.
# `build.rs` compiles that same file to a wasm32 cdylib (via a direct `rustc`
# invocation) and embeds it, so there is no separate crate for the UDF.
[package]
name = "wasm-udf-inline"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
spark-connect-macros = { package = "apache-spark-connect-macros", path = "../crates/spark-connect-macros", version = "4.2.0" }

# Host-only: the client + the macro-generated constructors. Never compiled for
# wasm32 (the wasm build only keeps the exported functions).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spark-connect = { package = "apache-spark-connect", path = "../crates/spark-connect", version = "4.2.0" }

# Force the proc-macro crate to be built before build.rs runs, so build.rs can
# find its compiled dylib to pass to the wasm `rustc` invocation.
[build-dependencies]
spark-connect-macros = { package = "apache-spark-connect-macros", path = "../crates/spark-connect-macros", version = "4.2.0" }
