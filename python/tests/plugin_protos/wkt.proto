// A file of a plugin of python/tests/test_proto_rust_offline.py that imports the protos of Spark
// Connect and well-known types other than Any and Timestamp: its generated module gets the classes
// of the drop-in's Rust protobuf runtime, whose classes of the well-known types have protobuf's
// methods of them. See plugin.proto for how the modules are generated.

syntax = "proto3";

package thirdparty.wkt;

import "spark/connect/relations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message Wkt {
  spark.connect.Relation input = 1;
  google.protobuf.Duration timeout = 2;
  google.protobuf.Struct options = 3;
  google.protobuf.Value value = 4;
  google.protobuf.ListValue list = 5;
  google.protobuf.Int64Value count = 6;
  google.protobuf.StringValue label = 7;
  google.protobuf.FieldMask mask = 8;
  google.protobuf.Empty nothing = 9;
  google.protobuf.Timestamp at = 10;
  repeated google.protobuf.Duration timeouts = 11;
  map<string, google.protobuf.Value> values = 12;
}
