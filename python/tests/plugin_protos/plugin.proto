// The proto of a plugin of Spark Connect, of the shapes of Delta Lake's
// delta/connect/relations.proto, for python/tests/test_proto_rust_offline.py: it imports the protos
// of Spark Connect, so its generated module gets the classes of the drop-in's Rust protobuf
// runtime, and base.proto, which does not.
//
// plugin_pb2.py and base_pb2.py are of protoc 33.0, from the root of the repository:
//   protoc -I python/tests -I crates/spark-connect-proto/proto --python_out=python/tests \
//     python/tests/plugin_protos/base.proto python/tests/plugin_protos/plugin.proto
// with the imports of the modules of Spark Connect rewritten to pyspark.sql.connect.proto and the
// license prepended, as Apache Spark's dev/gen-protos.sh does to its generated modules.

syntax = "proto3";

package thirdparty;

import "spark/connect/relations.proto";
import "spark/connect/expressions.proto";
import "plugin_protos/base.proto";

message DeleteFromTable {
  spark.connect.Relation target = 1;
  spark.connect.Expression condition = 2;
}

message PluginRelation {
  oneof relation_type {
    Scan scan = 1;
    DeleteFromTable delete_from_table = 2;
    MergeIntoTable merge_into_table = 3;
  }
}

message Scan {
  Table table = 1;
}

message Assignment {
  spark.connect.Expression field = 1;
  spark.connect.Expression value = 2;
}

message MergeIntoTable {
  spark.connect.Relation target = 1;
  spark.connect.Relation source = 2;
  spark.connect.Expression condition = 3;
  repeated Action matched_actions = 4;
  optional bool with_schema_evolution = 5;
  Mode mode = 6;
  map<string, spark.connect.Expression> defaults = 7;

  message Action {
    spark.connect.Expression condition = 1;
    oneof action_type {
      DeleteAction delete_action = 2;
      UpdateAction update_action = 3;
    }

    message DeleteAction {}

    message UpdateAction {
      repeated Assignment assignments = 1;
    }
  }
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_INSERT = 1;
  MODE_UPSERT = 2;
}
