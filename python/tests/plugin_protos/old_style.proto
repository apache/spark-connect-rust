// A file of a plugin of python/tests/test_proto_rust_offline.py that imports the protos of Spark
// Connect, whose module old_style_pb2.py is of the form of the modules of protoc before 3.20: it
// makes its classes with protobuf's reflection.GeneratedProtocolMessageType, not with protobuf's
// builder, which the drop-in wraps, so its classes stay protobuf's.
//
// old_style_pb2.py is written as protoc 3.19 writes a module (of the form of protobuf 3.19.6's own
// timestamp_pb2.py), of the FileDescriptorProto of this file that, from the root of the repository,
//   protoc -I python/tests -I crates/spark-connect-proto/proto \
//     --descriptor_set_out=old_style.desc python/tests/plugin_protos/old_style.proto
// gives, without the JSON names of its fields, which protoc leaves out of the modules that it
// generates, with the import of the module of Spark Connect rewritten to pyspark.sql.connect.proto
// and the license prepended, as Apache Spark's dev/gen-protos.sh does to its generated modules.

syntax = "proto3";

package thirdparty.old;

import "spark/connect/relations.proto";

message OldStyleRelation {
  spark.connect.Relation input = 1;
  string name = 2;
}
