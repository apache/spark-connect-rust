# Build-only checks complement the native ARM transport tests in rust.yml.
name: Release wheel build checks

on:
  pull_request:
    branches: [master, "branch-*"]
    paths: &wheel-build-paths
      - Cargo.toml
      - Cargo.lock
      - '**/Cargo.toml'
      - '**/build.rs'
      - crates/**
      - pyproject.toml
      - .cargo/**
      - rust-toolchain*
      - .github/workflows/release.yml
      - .github/workflows/build-wheel.yml
      - .github/workflows/arm-wheels.yml
  push:
    branches: [master, "branch-*"]
    paths: *wheel-build-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arm-wheels:
    name: Release wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise Linux ARM assembly through zig cc on an x86 host.
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: true }
          # Exercise both the x86_64 and aarch64 slices.
          - { os: macos-latest, target: universal2-apple-darwin }
    uses: ./.github/workflows/build-wheel.yml
    with:
      runner: ${{ matrix.os }}
      target: ${{ matrix.target }}
      zig: ${{ matrix.zig || false }}
      artifact_retention_days: 1
      source_repository: ${{ github.repository }}
      source_ref: ${{ github.sha }}
