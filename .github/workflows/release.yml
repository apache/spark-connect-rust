# Release workflow for the Rust crates (crates.io) and the Python wheel (PyPI).
#
# Following the Apache Spark model, releases are cut by a committer from THEIR
# OWN FORK, not from the canonical apache/ repository:
#
#   1. Enable GitHub Actions on your fork.
#   2. Add the release secrets to the fork:
#        - CARGO_REGISTRY_TOKEN  (crates.io API token)
#        - PYPI_API_TOKEN        (PyPI API token)
#   3. Bump the version in Cargo.toml and pyproject.toml (they must match).
#   4. Dispatch this workflow with dry_run=true to rehearse (default), then push
#      a matching `v<version>` tag (or dispatch with dry_run=false) to publish.
#
# A dry run fully rehearses BOTH sides without publishing: it packages and
# verify-builds every crate in dependency order (`cargo publish --dry-run`) and
# builds every wheel and the sdist. A tag push (or an explicit dry_run=false
# dispatch) additionally publishes to crates.io and PyPI. Both publish steps are
# idempotent, so a re-run after a partial failure skips what already landed.

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate artifacts but do not publish"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

# Only one release may run at a time, and a publish in flight is never cancelled
# (cancelling mid-publish is what leaves crates.io/PyPI half-updated).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo and pyproject versions agree (and match the tag, if any)
        run: |
          set -euo pipefail
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | awk -F'"' '{print $2}')
          PYPROJECT_VER=$(grep -m1 '^version' pyproject.toml | awk -F'"' '{print $2}')
          echo "Cargo.toml=${CARGO_VER}  pyproject.toml=${PYPROJECT_VER}"
          if [[ "${CARGO_VER}" != "${PYPROJECT_VER}" ]]; then
            echo "::error::Cargo.toml (${CARGO_VER}) and pyproject.toml (${PYPROJECT_VER}) versions differ"
            exit 1
          fi
          # Internal path-dependency version pins (e.g. spark-connect-core -> proto)
          # must track the workspace version, or `cargo publish` embeds a stale
          # requirement into the published crate.
          BAD=$(grep -rEn 'path = "\.\./spark-connect[^"]*"' crates/*/Cargo.toml \
                | grep -E 'version = "' \
                | grep -v "version = \"${CARGO_VER}\"" || true)
          if [[ -n "${BAD}" ]]; then
            echo "::error::internal path-dep version pin(s) do not match ${CARGO_VER}:"
            echo "${BAD}"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##*/}"
            if [[ "${TAG}" != "v${CARGO_VER}" ]]; then
              echo "::error::Pushed tag ${TAG} does not match version v${CARGO_VER}"
              exit 1
            fi
          fi

  publish-crates:
    name: Publish Rust crates to crates.io
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: cargo publish (dependency-ordered; dry-run unless releasing)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # true only for an explicit dry-run dispatch; tag pushes and an explicit
          # dry_run=false dispatch both evaluate to "false" and publish for real.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          # Leaf-first; cargo (>=1.90) orders and verify-builds these together,
          # resolving siblings from the local workspace.
          CRATES=(apache-spark-connect-proto apache-spark-connect-core apache-spark-connect)
          VER=$(grep -m1 '^version' Cargo.toml | awk -F'"' '{print $2}')

          if [[ "${DRY_RUN}" == "true" ]]; then
            # Rehearse the real publish. Because siblings resolve from the local
            # workspace, this works even before anything exists on crates.io.
            pkgs=(); for c in "${CRATES[@]}"; do pkgs+=(-p "$c"); done
            echo "::group::cargo publish --dry-run ${pkgs[*]}"
            cargo publish --dry-run "${pkgs[@]}"
            echo "::endgroup::"
            echo "Dry run only — nothing published."
            exit 0
          fi

          # Real publish. Skip any crate whose current version is already on
          # crates.io so a re-run after a partial failure is idempotent.
          pkgs=()
          for c in "${CRATES[@]}"; do
            if curl -sf -H "User-Agent: spark-connect-rust-release (dev@spark.apache.org)" \
                 "https://crates.io/api/v1/crates/${c}/${VER}" >/dev/null; then
              echo "${c} ${VER} is already on crates.io — skipping"
            else
              pkgs+=(-p "$c")
            fi
          done
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            echo "All crates already published at ${VER}; nothing to do."
            exit 0
          fi
          echo "::group::cargo publish ${pkgs[*]}"
          # cargo publishes in dependency order and waits for the index between
          # crates, so no manual sleep is needed.
          cargo publish "${pkgs[@]}"
          echo "::endgroup::"

  build-wheels:
    name: Build wheel (${{ matrix.target }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: true
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Add Rust target(s)
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            universal2-apple-darwin)
              rustup target add x86_64-apple-darwin aarch64-apple-darwin ;;
            *)
              rustup target add "${{ matrix.target }}" ;;
          esac
      - name: Install protoc
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y protobuf-compiler ;;
            macOS)   brew install protobuf ;;
            Windows) choco install protoc -y ;;
          esac
      - name: Build abi3 wheel with maturin
        # abi3-py39 produces a single wheel per (platform, arch) valid for
        # CPython 3.9+. `--zig` cross-links the Linux wheels against an old glibc
        # (manylinux2014), so they install on essentially any modern Linux rather
        # than only on the runner's glibc.
        shell: bash
        run: |
          python -m pip install --upgrade maturin
          args=(--release --out dist --target "${{ matrix.target }}")
          if [[ "${{ matrix.zig }}" == "true" ]]; then
            python -m pip install ziglang
            args+=(--zig)
          fi
          maturin build "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist with maturin
        # sdist packages source only (no compile), so protoc is not needed here.
        # It is the install fallback for platforms without a prebuilt wheel.
        run: |
          python -m pip install --upgrade maturin
          maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish-wheels:
    name: Publish wheel + sdist to PyPI
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          # Matches every wheels-<target> artifact plus wheels-sdist.
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        # Fork-based release: authenticate with the committer's PyPI token via twine
        # (avoids third-party publish actions; ASF Actions policy allowlists actions/*).
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          # --skip-existing makes a re-run after a partial upload safe.
          twine upload --skip-existing dist/*
