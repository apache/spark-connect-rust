# IMPORTANT: This is a separate, long-running parity job for pandas-on-Spark Connect
# tests. These tests take 30-60 minutes and are NOT part of the main parity workflow
# that other jobs wait on, so they run in isolation. The test step runs for real with
# full visibility into pass/fail status. If this becomes a critical blocker, add
# continue-on-error: true back in; currently it provides honest signal on pandas parity.

name: Pandas Connect Parity (Spark 4.2.0)

# Cancel an in-progress run when a newer commit supersedes it (per workflow + ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  SPARK_VERSION: "4.2.0"
  SPARK_CONNECT_TESTING_REMOTE: sc://localhost:15002
  SPARK_TESTING: "1"
  SPARK_SKIP_CONNECT_COMPAT_TESTS: "1"   # force remote-only (pure connect, no local JVM)

jobs:
  # ---------------------------------------------------------------------------
  # Pandas-on-Spark Connect parity: run the official pandas tests through our
  # Rust client against a real Spark 4.2.0 Connect server. This is a separate,
  # long-running job (30-60 min) to avoid blocking the main parity gate.
  # ---------------------------------------------------------------------------
  pandas-parity:
    name: Pandas parity (official suite via our client, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Pandas tests take ~30-60 min; bound the job so a genuinely hung test fails it
    # instead of running to GitHub's 6-hour default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust toolchain
        # rustup is preinstalled; avoid third-party toolchain actions (ASF Actions
        # policy allowlists actions/* only).
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pandas-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pandas-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # scipy is required by the pandas-on-Spark correlation tests (corr method='spearman'/
          # 'kendall', corrwith); it is part of Apache Spark's own pandas test environment.
          # pandas is pinned < 3.0.0: Spark 4.2.0's pandas-on-Spark code targets pandas 2.x and
          # explicitly warns that >= 3.0.0 is not yet fully supported (e.g. test_frame_loc_setitem
          # hits an upstream pandas-3-only no-op branch). Testing the supported version, matching
          # Apache's own pandas test environment.
          python -m pip install pytest 'pandas>=2.2,<3.0' pyarrow numpy scipy grpcio grpcio-status googleapis-common-protos cloudpickle zstandard py4j pyyaml

      - name: Build the Rust extension into the skin
        # The parity diff drives both clients via PYTHONPATH (our ./python for ours,
        # the spark checkout for reference), so we do NOT install a wheel (which would
        # collide in site-packages with the reference pyspark). We just build the
        # extension and drop it into python/pyspark so ./python is a working package.
        run: |
          cargo build -p pyspark-rs --release
          cp target/release/lib_pyspark.so python/pyspark/_pyspark.so

      - name: Cache Spark ${{ env.SPARK_VERSION }} distribution
        uses: actions/cache@v4
        with:
          path: ~/spark-dist
          key: spark-dist-${{ env.SPARK_VERSION }}-hadoop3

      - name: Download Apache Spark ${{ env.SPARK_VERSION }} (Connect server)
        id: spark-download
        run: |
          PKG="spark-${SPARK_VERSION}-bin-hadoop3"
          if [ ! -d "${HOME}/spark-dist/${PKG}" ]; then
            URL="https://archive.apache.org/dist/spark/spark-${SPARK_VERSION}/${PKG}.tgz"
            mkdir -p "${HOME}/spark-dist"
            echo "Downloading ${URL}"
            wget -q -O "${HOME}/spark-dist/${PKG}.tgz" "${URL}"
            tar -xzf "${HOME}/spark-dist/${PKG}.tgz" -C "${HOME}/spark-dist"
            rm -f "${HOME}/spark-dist/${PKG}.tgz"
          else
            echo "Using cached Spark distribution."
          fi
          echo "SPARK_HOME=${HOME}/spark-dist/${PKG}" >> "$GITHUB_OUTPUT"

      - name: Cache Spark ${{ env.SPARK_VERSION }} source (official test files)
        uses: actions/cache@v4
        with:
          path: ~/spark-source
          key: spark-source-${{ env.SPARK_VERSION }}

      - name: Clone Apache Spark v${{ env.SPARK_VERSION }} (official test files + reference client)
        id: spark-source
        run: |
          if [ ! -d "${HOME}/spark-source/python" ]; then
            git clone --depth 1 --branch "v${SPARK_VERSION}" \
              https://github.com/apache/spark.git "${HOME}/spark-source"
          else
            echo "Using cached Spark source."
          fi
          echo "SPARK_SOURCE=${HOME}/spark-source" >> "$GITHUB_OUTPUT"

      - name: Start Spark Connect server
        env:
          # The server spawns Python workers for UDF/arrow/mapInPandas execution; they
          # need pandas + pyarrow (installed above) plus pyspark (from SPARK_HOME/python).
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          SPARK_HOME="${{ steps.spark-download.outputs.SPARK_HOME }}"
          echo "Starting Connect server on ${SPARK_CONNECT_TESTING_REMOTE}"
          # Give the driver extra heap for the pandas tests which are I/O heavy.
          # Set the server JVM timezone to America/Los_Angeles and match it on the client
          # (TZ below). This replicates Apache Spark's own test environment, which fixes the
          # timezone for determinism (pom.xml surefire/scalatest `<timeZone>America/Los_Angeles`
          # and pyspark.testing goldenutils.setup_timezone). It is NOT a UTC hack: a Spark
          # TIMESTAMP is a tz-less instant, and the pandas tests compare against pure-pandas
          # wall-clock, so the round-trip only holds when the client's local timezone equals the
          # server's (createDataFrame localizes with the session tz; lit(datetime) uses the
          # client's local tz via time.mktime). Real pyspark fails identically when they differ.
          # spark.sql.session.timeZone is left to derive from the JVM default, as Apache does.
          "${SPARK_HOME}/sbin/start-connect-server.sh" \
            --packages "org.apache.spark:spark-connect_2.13:${SPARK_VERSION}" \
            --driver-memory 3g \
            --conf spark.sql.session.localRelationSizeLimit=1073741824 \
            --conf spark.driver.extraJavaOptions=-Duser.timezone=America/Los_Angeles \
            --conf spark.executor.extraJavaOptions=-Duser.timezone=America/Los_Angeles \
            > /tmp/connect-server.log 2>&1 &
          for i in $(seq 1 90); do
            if (echo > /dev/tcp/localhost/15002) 2>/dev/null; then
              echo "Connect server is up (after ${i}s)."; break
            fi
            if [ "$i" -eq 90 ]; then echo "Server failed to start:"; cat /tmp/connect-server.log; exit 1; fi
            sleep 1
          done

      - name: Pandas Connect parity tests via OUR Rust client
        id: pandas-parity
        env:
          PYTHONUNBUFFERED: "1"   # stream per-file progress into the live log
          TZ: America/Los_Angeles # match the server JVM timezone (see server startup); Apache's test convention
          PYTHONPATH: ${{ github.workspace }}/scripts:${{ steps.spark-source.outputs.SPARK_SOURCE }}/python
          RUST_PYSPARK_SO: ${{ github.workspace }}/python/pyspark/_pyspark.so
        working-directory: ${{ steps.spark-source.outputs.SPARK_SOURCE }}/python
        run: |
          set -o pipefail
          # Run the pandas-on-Spark Connect test suite through our Rust client.
          # The pandas tests are in python/pyspark/pandas/tests/connect/ in the
          # official Spark source tree. We inject the Rust transport plugin via
          # PYTHONPATH and env vars to exercise our client. We run from the Spark
          # source python/ directory with the test path relative to it, matching
          # the reference client's invocation pattern.
          python -m pytest \
            -q \
            -rfE \
            --tb=short \
            -p no:cacheprovider \
            -p rust_transport_plugin \
            pyspark/pandas/tests/connect \
            2>&1 | tee /tmp/pandas_parity.log

      - name: Upload pandas parity log + server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandas-parity-py${{ matrix.python-version }}
          path: |
            /tmp/pandas_parity.log
            /tmp/connect-server.log
          if-no-files-found: warn
