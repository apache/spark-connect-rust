name: Python Arrow compatibility

on:
  push:
    branches: [master, "branch-*"]
  pull_request:
    branches: [master, "branch-*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter:
    name: Python Arrow (PyO3 ${{ matrix.pyo3 }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pyo3: ["0.28.3", "0.29.0", "0.30.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install reference Python converters
        run: python -m pip install "pyspark-client==4.2.0" "pyarrow==26.0.0"
      - name: Isolate the standalone crate and select PyO3
        # The workspace lockfile pins 0.30.1. Build outside it so each matrix leg
        # actually compiles the converter against the requested minor version.
        run: |
          cp -R crates/spark-python-arrow "$RUNNER_TEMP/spark-python-arrow"
          cargo generate-lockfile --manifest-path "$RUNNER_TEMP/spark-python-arrow/Cargo.toml"
          cargo update --manifest-path "$RUNNER_TEMP/spark-python-arrow/Cargo.toml" \
            -p pyo3 --precise "${{ matrix.pyo3 }}"
          cargo tree --manifest-path "$RUNNER_TEMP/spark-python-arrow/Cargo.toml" --locked -i pyo3
      - name: Test native and official PySpark conversion semantics
        run: |
          cargo test --manifest-path "$RUNNER_TEMP/spark-python-arrow/Cargo.toml" \
            --locked --features pyo3/abi3-py39 -- --include-ignored
      - name: Check converter Clippy
        run: |
          cargo clippy --manifest-path "$RUNNER_TEMP/spark-python-arrow/Cargo.toml" \
            --locked --all-targets --features pyo3/abi3-py39 -- -D warnings
