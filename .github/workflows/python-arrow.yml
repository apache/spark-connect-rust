name: Python Arrow export

on:
  push:
    branches: [master, "branch-*"]
  pull_request:
    branches: [master, "branch-*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter:
    name: Python Arrow export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install PyArrow
        run: python -m pip install "pyarrow==26.0.0"
      - name: Test Arrow table export
        # Test separately from pyspark-rs: extension-module feature unification
        # would disable libpython linking for the embedded Python tests.
        run: |
          cargo test -p spark-python-arrow --locked --features pyo3/abi3-py39
      - name: Check converter Clippy
        run: |
          cargo clippy -p spark-python-arrow \
            --locked --all-targets --features pyo3/abi3-py39 -- -D warnings
