name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# `mkdocs gh-deploy` builds the site and pushes it to the `gh-pages` branch,
# which ASF INFRA serves as GitHub Pages (see `.asf.yaml`: `ghp_branch:
# gh-pages`). Only first-party `actions/*` are used, per the ASF Actions policy.
permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy the docs site
    runs-on: ubuntu-latest
    # Only ever publish from the canonical repository's master branch (covers
    # both push and workflow_dispatch); forks and non-master refs never deploy.
    if: github.repository == 'apache/spark-connect-rust' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install "mkdocs-material==9.*"

      - name: Build and deploy to the gh-pages branch
        run: mkdocs gh-deploy --force --no-history
