name: Rust CI

# Cancel an in-progress run when a newer commit supersedes it (per workflow + ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust-build-and-test:
    name: Rust build and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust-version: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rustup is preinstalled on the runner; use it directly so we depend only on
        # GitHub-authored actions (ASF Actions policy allowlists actions/*, not
        # third-party toolchain actions).
        run: |
          rustup toolchain install ${{ matrix.rust-version }} --profile minimal
          rustup default ${{ matrix.rust-version }}

      - name: Cache cargo & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rust-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cargo build (non-pyspark crates only)
        # Build only the non-extension crates; pyspark-rs is excluded from
        # default-members and requires maturin/Python to build.
        run: cargo build --release

      - name: Cargo test (spark-connect and spark-connect-core)
        # Test the core transport and pure-Rust client crates
        run: cargo test -p apache-spark-connect -p apache-spark-connect-core --release

      - name: Cargo build/test with optional conversion features (datafusion, polars)
        # Exercises the to_datafusion()/to_polars() conversions, which are gated
        # behind off-by-default features whose deps are pulled from crates.io.
        run: |
          cargo build -p apache-spark-connect --features datafusion,polars --release
          cargo test -p apache-spark-connect --features datafusion,polars --release

      - name: No-stub audit
        # Enforce the "100% coverage, no followups" rule
        run: bash scripts/audit_no_stubs.sh

  wasm-udf:
    name: WASM UDF feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (+ wasm32 target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Python packer/runtime deps
        # The client builds the UDF command by running the packer embedded in the
        # crate as `python -c` (needs `pyspark` for its vendored cloudpickle + the
        # pure-Python type parser); `wasmtime` is what the executors need at run time
        # and lets a follow-up job exercise the module directly.
        run: python -m pip install --upgrade cloudpickle pyspark wasmtime

      - name: Feature-gated unit tests
        run: cargo test -p apache-spark-connect --features wasm-udf

      - name: Build the macro/build helpers and WASM UDF crates + examples
        run: |
          cargo build -p apache-spark-connect-macros -p apache-spark-connect-build
          cargo build --manifest-path examples/wasm-udfs/Cargo.toml
          cargo build --manifest-path examples/wasm-udf-inline/Cargo.toml
          cargo build -p examples --bin wasm_udf_macro --features examples/wasm-udf-macro

      - name: Packer end-to-end (Rust -> cloudpickle command)
        # The packer is embedded in the crate and run as `python -c`; it imports the
        # reference `pyspark` (installed above) for `pyspark.cloudpickle` and
        # `pyspark.sql.types._parse_datatype_json_value`, and produces a reference
        # `DataType` the executors unpickle. No separate `pyspark_wasm_udf` package
        # is needed on any path now, so just run the ignored end-to-end test.
        run: cargo test -p apache-spark-connect --features wasm-udf -- --ignored packer_produces
