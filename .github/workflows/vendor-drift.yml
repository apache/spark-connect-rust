name: Vendored upstream drift

# Guards that directories vendored verbatim from Apache Spark (e.g. cloudpickle,
# brought in via git subtree) stay byte-identical to the pinned v4.2.0 tag. Catches
# accidental local edits to upstream-tracked code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, "branch-*"]
  pull_request:
    branches: [master, "branch-*"]

jobs:
  vendored-drift:
    name: Vendored files match Apache Spark v4.2.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare vendored dirs against upstream
        run: bash scripts/check_vendored_upstream.sh
