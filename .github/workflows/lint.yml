name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  rust-fmt-clippy:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (rustfmt + clippy)
        # rustup is preinstalled; avoid third-party toolchain actions (ASF Actions
        # policy allowlists actions/* only).
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Cache cargo & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: rustfmt (check) - blocking
        run: cargo fmt --all --check
      - name: clippy - advisory
        # Advisory for now: the tree still carries pre-existing warnings. This surfaces
        # them in the log without blocking. Tighten to `-- -D warnings` once cleaned.
        run: cargo clippy --workspace --all-targets || true

  python-ruff:
    name: ruff (our scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install "ruff==0.14.0"
      - name: ruff check - blocking
        run: ruff check scripts/
      - name: ruff format (check) - blocking
        run: ruff format --check scripts/
