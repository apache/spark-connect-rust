name: Lint

# Cancel an in-progress run when a newer commit supersedes it (per workflow + ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, "branch-*"]
  pull_request:
    branches: [master, "branch-*"]
  workflow_dispatch:

jobs:
  rust-fmt-clippy:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    env:
      # The toolchain that this job pins (see "Install Rust toolchain"). The cache key names
      # it, so that a bump does not restore the artifacts of another toolchain. A bump also
      # updates the version that docs/contributing.md and AGENTS.md give.
      LINT_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (rustfmt + clippy)
        # rustup is preinstalled; avoid third-party toolchain actions (ASF Actions
        # policy allowlists actions/* only). This job pins its toolchain, so that a new
        # release of clippy or rustfmt cannot change its verdict without a code change: bump
        # it on purpose. The build and test jobs stay on floating stable, which catches a
        # toolchain release that breaks the build on the day that it ships.
        run: |
          rustup toolchain install "$LINT_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$LINT_TOOLCHAIN"
          # `--workspace` reaches `examples/wasm-udfs` (a path dependency of the `examples`
          # member), whose build script compiles its UDFs to WASM.
          rustup target add wasm32-unknown-unknown
      - name: Set up JDK for workspace JNI headers
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache cargo & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ env.LINT_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-${{ env.LINT_TOOLCHAIN }}-
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: rustfmt (check) - blocking
        run: cargo fmt --all --check
      - name: clippy - blocking
        # Any finding fails the job. Lints this codebase triggers by design are allowed once,
        # with a reason, in `[workspace.lints.clippy]` of the root Cargo.toml. The workspace
        # run builds `apache-spark-connect` with `wasm-udf` on (feature unification through
        # `examples/wasm-udfs`); the second run covers the default feature set, and the third
        # the `datafusion` and `polars` integrations. The crates that the workspace excludes,
        # which the other workflows build and test, are linted through their manifests.
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p apache-spark-connect --all-targets -- -D warnings
          cargo clippy -p apache-spark-connect --all-targets --features datafusion,polars -- -D warnings
          # They have no committed Cargo.lock, so each run resolves their dependencies afresh, as
          # the workflows that build them do. They share the workspace's cached target directory,
          # which already has the artifacts of the dependencies that resolve to the same versions.
          for crate in examples/wasm-udfs examples/wasm-udf-inline tests/wasm-udf; do
            CARGO_TARGET_DIR="$PWD/target" \
              cargo clippy --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings
          done
      - name: Tooling unit tests
        run: python3 -m unittest discover -s scripts/tests
      - name: LICENSE-binary and NOTICE-binary are up to date
        # They list the Rust dependencies that the wheels link, from Cargo.lock. A change of
        # dependencies without regenerating them (python3 scripts/gen_binary_licenses.py) fails.
        run: python3 scripts/gen_binary_licenses.py --check

  python-ruff:
    name: ruff (our scripts, tests and hand-written pyspark shim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install "ruff==0.14.0"
      - name: ruff excludes match the vendored drift gate - blocking
        # The vendored paths that pyproject.toml keeps out of ruff must be exactly those of
        # scripts/check_vendored_upstream.sh (standard library only, no build needed).
        run: python python/tests/test_ruff_excludes.py
      - name: ruff check - blocking
        # Scope comes from [tool.ruff] in pyproject.toml: scripts/, the embedded Row and values,
        # python/tests and the hand-written (not vendored, not generated) python/pyspark.
        run: ruff check
      - name: ruff format (check) - blocking
        # python/tests and python/pyspark are excluded by [tool.ruff.format].
        run: ruff format --check
