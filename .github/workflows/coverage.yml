name: Coverage

# Cancel an in-progress run when a newer commit supersedes it (per workflow + ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, "branch-*"]
  pull_request:
    branches: [master, "branch-*"]

env:
  CARGO_TERM_COLOR: always
  SPARK_VERSION: "4.3.0"
  # Coverage floors, in percent, enforced by the last step of the job. They are regression
  # floors set just below what master measures, not the target: AGENTS.md states the target
  # (>90% on both sides). Rust is the line coverage of cargo-llvm-cov; Python is the
  # percent_covered of coverage.py (lines and branches) within the scope of python/.coveragerc.
  # The Rust number moves by about 0.1 between runs of the same commit, since the e2e tests
  # run against a live server. Raise a floor as coverage grows; lower one only on purpose.
  RUST_COVERAGE_FLOOR: "92.0"
  PYTHON_COVERAGE_FLOOR: "93.0"

jobs:
  coverage:
    name: Measure and publish coverage badges
    runs-on: ubuntu-latest
    # Bound the job: coverage now runs the behavioral e2e suite against a live Spark
    # Connect server, so a hung test fails the job instead of running to the 6-hour default.
    timeout-minutes: 45
    permissions:
      contents: write  # Needed to push to badges branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for badges branch operations

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        # Two sets: (1) build deps for the Python-coverage half (maturin/pytest/coverage);
        # (2) the runtime deps the Connect server's Python workers need for arrow/pandas
        # execution (mirrors build_python_connect.yml).
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest coverage
          python -m pip install pandas pyarrow numpy grpcio grpcio-status googleapis-common-protos cloudpickle zstandard py4j

      - name: Cache Spark ${{ env.SPARK_VERSION }} distribution
        uses: actions/cache@v4
        with:
          path: ~/spark-dist
          key: spark-dist-${{ env.SPARK_VERSION }}-hadoop3

      - name: Download Apache Spark ${{ env.SPARK_VERSION }} (Connect server)
        id: spark-download
        run: |
          PKG="spark-${SPARK_VERSION}-bin-hadoop3-connect"
          if [ ! -d "${HOME}/spark-dist/spark-4.3.0-bin-hadoop3"* ]; then
            URL="https://archive.apache.org/dist/spark/spark-${SPARK_VERSION}/${PKG}.tgz"
            mkdir -p "${HOME}/spark-dist"
            echo "Downloading ${URL}"
            wget -q -O "${HOME}/spark-dist/${PKG}.tgz" "${URL}"
            tar -xzf "${HOME}/spark-dist/${PKG}.tgz" -C "${HOME}/spark-dist"
            rm -f "${HOME}/spark-dist/${PKG}.tgz"
          else
            echo "Using cached Spark distribution."
          fi
          SPARK_HOME=$(find "${HOME}/spark-dist" -maxdepth 1 -type d -name 'spark-4.3.0-bin-hadoop3*' | head -1)
          echo "SPARK_HOME=${SPARK_HOME}" >> "$GITHUB_OUTPUT"

      - name: Start Spark Connect server
        env:
          # The server spawns Python workers for arrow/pandas execution; they need
          # pandas + pyarrow (installed above) plus pyspark (from SPARK_HOME/python).
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          SPARK_HOME="${{ steps.spark-download.outputs.SPARK_HOME }}"
          echo "Starting Connect server on sc://localhost:15002"
          # As for the behavioral e2e tests: a small senderMaxStreamSize exercises the
          # client's reattach path on every result over 1 MiB.
          "${SPARK_HOME}/sbin/start-connect-server.sh" \
            --driver-memory 3g \
            --conf spark.sql.session.localRelationSizeLimit=1073741824 \
            --conf spark.connect.execute.reattachable.senderMaxStreamSize=1048576 \
            > /tmp/connect-server.log 2>&1 &
          for i in $(seq 1 90); do
            if (echo > /dev/tcp/localhost/15002) 2>/dev/null; then
              echo "Connect server is up (after ${i}s)."; break
            fi
            if [ "$i" -eq 90 ]; then echo "Server failed to start:"; cat /tmp/connect-server.log; exit 1; fi
            sleep 1
          done

      - name: Generate Rust coverage report
        # The behavioral e2e_* tests self-gate on SPARK_REMOTE and no-op without a live
        # server, so a server-less coverage run undercounts the runtime execution paths
        # (collect/count/RPC-backed DataFrame, functions, session, catalog, ...) and the
        # badge showed only ~73%. Run coverage in two accumulated passes and combine:
        #   1. the default unit + golden (plan-serialization) tests, run in parallel;
        #   2. the behavioral e2e suite against the live server (SPARK_REMOTE set), run
        #      serially since the tests share one server session.
        # `--no-report` accumulates raw coverage; `report` merges both passes into one JSON.
        run: |
          cargo llvm-cov clean --workspace
          # Include apache-spark-connect-core: it is core client code (transport, retries, error
          # handling, reattach) with its own substantial unit-test suite. Running -p apache-spark-connect
          # alone never executed those tests, so its files reflected only incidental e2e coverage
          # (e.g. error.rs at ~35%), dragging the total below 90%.
          cargo llvm-cov --no-cfg-coverage --no-report -p apache-spark-connect -p apache-spark-connect-core
          # The second line of tests is the ML live tests that the connect-e2e job of
          # build_python_connect.yml runs: keep the two lists in sync. Without them, the native ML
          # code counts only its unit and golden tests.
          SPARK_REMOTE=sc://localhost:15002 \
            cargo llvm-cov --no-cfg-coverage --no-report -p apache-spark-connect \
              --test e2e_functions --test e2e_columns --test e2e_dataframe \
              --test e2e_coverage --test e2e_integration \
              --test e2e_streaming --test e2e_new_methods \
              --test e2e_ops_breadth --test e2e_session_catalog \
              --test e2e_linear_svc --test e2e_linear_regression --test e2e_generalized_linear_regression --test e2e_remaining_classifiers --test e2e_remaining_regressors --test e2e_kmeans --test e2e_bisecting_kmeans --test e2e_gaussian_mixture --test e2e_remaining_clustering --test e2e_ml_features --test e2e_frequent_patterns --test e2e_als --test e2e_evaluators --test e2e_statistics --test e2e_ml_object --test e2e_feature_models --test e2e_ml_regression_api --test e2e_ml_clustering_api --test e2e_decision_tree_regressor --test e2e_decision_tree_classifier --test e2e_gbt_regressor --test e2e_naive_bayes --test e2e_gbt_classifier --test e2e_random_forest --test e2e_random_forest_regressor \
              -- --test-threads=1
          cargo llvm-cov report --json --output-path coverage-rust-llvm.json
          # Per-file table into the job log, so coverage regressions are easy to see
          # (which file dropped) without downloading the JSON artifact.
          cargo llvm-cov report --summary-only

      - name: Parse Rust coverage and create badge JSON
        # Extract line coverage % from llvm-cov JSON output and convert to shields.io
        # endpoint format. Parse the JSON, extract the "line" coverage percentage,
        # and generate the endpoint badge structure.
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import os

          # Read the llvm-cov output. NB: this report is named coverage-rust-llvm.json,
          # NOT coverage-rust.json - the latter is the badge file published at the root of
          # the `badges` branch, and an untracked working-tree coverage-rust.json here
          # makes the later `git checkout badges` abort ("untracked working tree files
          # would be overwritten"). Keeping the raw report under a distinct name avoids it.
          with open("coverage-rust-llvm.json", "r") as f:
              data = json.load(f)

          # cargo-llvm-cov emits the llvm "export" format: the summary lives under
          # data[0].totals.{lines,regions,functions}.percent. The previous code read
          # data[0].line_coverage_percent, a key that does not exist, so it always fell
          # back to 0 and the badge showed 0.0%. Use line coverage, falling back to
          # region then function coverage.
          coverage_pct = None
          if data.get("data"):
              totals = data["data"][0].get("totals", {})
              for key in ("lines", "regions", "functions"):
                  metric = totals.get(key)
                  if isinstance(metric, dict) and "percent" in metric:
                      coverage_pct = metric["percent"]
                      break

          if coverage_pct is None:
              coverage_pct = 0

          # Determine color based on coverage threshold
          if coverage_pct >= 80:
              color = "green"
          elif coverage_pct >= 60:
              color = "yellow"
          else:
              color = "red"

          # Create shields.io endpoint JSON format
          badge_json = {
              "schemaVersion": 1,
              "label": "rust coverage",
              "message": f"{coverage_pct:.1f}%",
              "color": color
          }

          with open("coverage-rust-badge.json", "w") as f:
              json.dump(badge_json, f)

          # The floor is checked in the last step, after the badge is published.
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"RUST_COVERAGE_PCT={coverage_pct}\n")

          print(f"Rust coverage: {coverage_pct:.1f}% ({color})")
          PYTHON_EOF

      - name: Build Python extension
        run: |
          cargo build -p pyspark-rs --release
          cp target/release/lib_pyspark.so python/pyspark/_pyspark.so

      - name: Offline Python test suite (under coverage)
        # This step is the only place the offline suite runs, on every pull request and
        # every push, so it is the gate for these tests as well as the coverage measurement:
        # a failing test fails the job here. -rs lists every skipped test with its reason,
        # so that a test skipped for a missing or too-old dependency shows in the log.
        run: |
          cd python
          PYTHONPATH=$(pwd) python -m coverage run --rcfile=.coveragerc -m pytest -rs \
            tests/test_dropin_offline.py tests/test_arrow_handoff.py tests/test_ml_offline.py tests/test_ml_features_offline.py tests/test_frequent_patterns_offline.py tests/test_als_offline.py tests/test_evaluators_offline.py tests/test_statistics_offline.py
          PYTHONPATH=$(pwd) python -m coverage json --rcfile=.coveragerc -o coverage-python.json

      - name: Parse Python coverage and create badge JSON
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import os

          # Read the coverage JSON output
          with open("python/coverage-python.json", "r") as f:
              data = json.load(f)

          # Extract percent covered from totals
          coverage_pct = data["totals"]["percent_covered"]

          # Determine color based on coverage threshold
          if coverage_pct >= 90:
              color = "green"
          elif coverage_pct >= 75:
              color = "yellow"
          else:
              color = "red"

          # Create shields.io endpoint JSON format
          badge_json = {
              "schemaVersion": 1,
              "label": "python coverage",
              "message": f"{coverage_pct:.1f}%",
              "color": color
          }

          with open("coverage-python-badge.json", "w") as f:
              json.dump(badge_json, f)

          # The floor is checked in the last step, after the badge is published.
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PYTHON_COVERAGE_PCT={coverage_pct}\n")

          print(f"Python coverage: {coverage_pct:.1f}% ({color})")
          PYTHON_EOF

      - name: Check if badges branch exists
        id: check-badges-branch
        run: |
          if git rev-parse --verify origin/badges > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create/update badges branch (orphan)
        if: github.event_name == 'push' && github.repository == 'apache/spark-connect-rust' && github.ref == 'refs/heads/master'
        run: |
          # Commit the badges to the badges branch (orphan, contains only badge files).
          # This approach uses git directly: checkout/create the orphan badges branch,
          # copy in the badge files, and force-push (badges branch is always ephemeral).
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Fetch badges branch if it exists
          if git rev-parse --verify origin/badges > /dev/null 2>&1; then
            git fetch origin badges:badges
            git checkout badges
          else
            # Create orphan branch (no parent commits)
            git checkout --orphan badges
            git rm -rf .
          fi

          # Copy new badges into the branch root (not in a subdirectory)
          cp coverage-rust-badge.json coverage-rust.json
          cp coverage-python-badge.json coverage-python.json

          # Commit and push
          git add coverage-rust.json coverage-python.json
          git commit -m "ci: update coverage badges" || echo "No changes to commit"
          git push -f origin badges

      - name: Upload coverage reports as artifacts (for PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badges
          path: |
            coverage-rust-badge.json
            coverage-python-badge.json
            coverage-rust-llvm.json
            python/coverage-python.json
          retention-days: 5

      - name: Enforce coverage floors
        # After the badge and the artifacts, so that a run below a floor still publishes the
        # number it measured. Reads only the environment: on a push to master the step that
        # updates the badges has left the checkout on the badges branch.
        run: |
          python3 << 'PYTHON_EOF'
          import os
          import sys

          failed = False
          for side in ("RUST", "PYTHON"):
              measured = float(os.environ[f"{side}_COVERAGE_PCT"])
              floor = float(os.environ[f"{side}_COVERAGE_FLOOR"])
              ok = measured >= floor
              failed = failed or not ok
              print(f"{side.lower()} coverage: {measured:.2f}% (floor {floor:.2f}%): {'ok' if ok else 'BELOW FLOOR'}")
              if not ok:
                  print(
                      f"::error::{side.lower()} coverage {measured:.2f}% is below the floor of "
                      f"{floor:.2f}% ({side}_COVERAGE_FLOOR in .github/workflows/coverage.yml)"
                  )
          sys.exit(1 if failed else 0)
          PYTHON_EOF

      - name: Upload Connect server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-connect-server-log
          path: /tmp/connect-server.log
          if-no-files-found: warn
