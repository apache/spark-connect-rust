[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyspark-client-rust"
version = "4.3.0"
description = "Rust-backed drop-in for the PySpark Spark Connect client (pyspark-client): the same `pyspark` API and results, powered by a native Rust engine (tonic) instead of grpcio/py4j."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Apache Spark", email = "dev@spark.apache.org"}]
keywords = ["pyspark", "spark", "spark-connect", "connect", "pyspark-client", "rust", "tonic", "grpc", "arrow", "dataframe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "pandas>=1.0.0",
    "pyarrow>=10.0.0",
    "numpy>=1.16.0",
]
# cloudpickle is vendored at pyspark/cloudpickle (matching Apache Spark's own
# bundling), so it is intentionally NOT an external dependency.
#
# No optional-dependencies: unlike upstream PySpark's `connect` extra, this
# package has no pure-Python gRPC client — the Rust extension (pyspark._pyspark)
# speaks gRPC via tonic, so grpcio is never imported at runtime.

[project.urls]
Homepage = "https://spark.apache.org/"
Documentation = "https://apache.github.io/spark-connect-rust/"
Repository = "https://github.com/apache/spark-connect-rust"
"Bug Tracker" = "https://issues.apache.org/jira/browse/SPARK"

[tool.ruff]
# Lint only our authored tooling/scripts. The python/pyspark tree is largely vendored
# from Apache Spark (pandas-on-Spark, the drop-in skin) and must stay
# byte-compatible with upstream, so it is intentionally excluded from our linter.
line-length = 100
target-version = "py39"
extend-exclude = ["python/pyspark", "target", ".claude"]
include = ["scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by the formatter, not enforced hard

[tool.maturin]
# Mixed Python/Rust layout: the pure-Python drop-in skin lives under python/pyspark,
# and the PyO3 extension is placed inside it as pyspark._pyspark.
python-source = "python"
module-name = "pyspark._pyspark"
manifest-path = "crates/pyspark-rs/Cargo.toml"
# Use abi3 for a stable ABI compatible across Python 3.9+.
features = ["pyo3/abi3-py39", "pyo3/extension-module"]
# Keep tests out of the built wheel/sdist: our own offline suite lives outside the package
# (python/tests), but the vendored pyspark tree carries upstream test modules
# (e.g. pyspark/pipelines/tests, pyspark/testing/tests) that end users don't need.
exclude = [
    "python/pyspark/**/tests/**",
    "python/pyspark/**/test_*.py",
    "pyspark/**/tests/**",
    "pyspark/**/test_*.py",
]
