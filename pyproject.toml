[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyspark-client-rust"
version = "4.3.0"
description = "Rust-backed drop-in for the PySpark Spark Connect client (pyspark-client): the same `pyspark` API and results, powered by a native Rust engine (tonic) instead of grpcio/py4j."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Apache Spark", email = "dev@spark.apache.org"}]
keywords = ["pyspark", "spark", "spark-connect", "connect", "pyspark-client", "rust", "tonic", "grpc", "arrow", "dataframe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "pandas>=1.0.0",
    "pyarrow>=10.0.0",
    "numpy>=1.16.0",
]
# cloudpickle is vendored at pyspark/cloudpickle (matching Apache Spark's own
# bundling), so it is intentionally NOT an external dependency.
#
# No optional-dependencies: unlike upstream PySpark's `connect` extra, this
# package has no pure-Python gRPC client — the Rust extension (pyspark._pyspark)
# speaks gRPC via tonic, so grpcio is never imported at runtime.

[project.urls]
Homepage = "https://spark.apache.org/"
Documentation = "https://apache.github.io/spark-connect-rust/"
Repository = "https://github.com/apache/spark-connect-rust"
"Bug Tracker" = "https://issues.apache.org/jira/browse/SPARK"

[tool.ruff]
# Lint the code this project authors: the tooling under scripts/, the embedded Row and
# value classes, the test suites under python/tests, and the hand-written drop-in shim
# under python/pyspark (the modules that are neither vendored nor generated).
line-length = 100
target-version = "py39"
# Apply the excludes below to the paths given on the command line too, so that
# `ruff check <file>` or an editor integration skips a vendored or generated file, as
# `ruff check` of the whole tree does.
force-exclude = true
include = [
    "scripts/**/*.py",
    "crates/pyspark-rs/src/row.py",
    "crates/pyspark-rs/src/values.py",
    "python/tests/**/*.py",
    "python/pyspark/**/*.py",
    "python/pyspark/**/*.pyi",
]
