[tool.ruff.format]
# The formatter gate covers scripts/ and the embedded Row and values. python/tests and the shim
# are linted but not (yet) formatted: reformatting them in one sweep would conflict with
# every open pull request, so a bare `ruff format` must not touch them.
exclude = ["python/tests/**", "python/pyspark/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by the formatter, not enforced hard

[tool.ruff.lint.per-file-ignores]
# Test suites. B017/B018: tests assert that an expression raises, with a bare attribute
# access or a broad assertRaises. B023: closures over a loop variable are called within the
# same iteration. E402: imports follow sys.path / importorskip setup. E731: one-line lambdas
# are the fixtures of the UDF tests. B015: a bare comparison is the operation under test
# inside pytest.raises. B028: the warnings are fixtures, where they point is not asserted.
"python/tests/**" = ["B015", "B017", "B018", "B023", "B028", "E402", "E731"]
# PySpark warns without a stacklevel; the shim keeps the same attribution of its warnings.
"python/pyspark/**" = ["B028"]
# The import order of a package __init__ is its load order, and the order of star imports
# decides which module's name wins (sql/connect/proto), so isort does not rearrange it.
"python/pyspark/**/__init__.py" = ["I001"]
# The public functions are injected from functions_generated.py through globals(), so
# __all__ names them without a static definition (F822), and the module-level imports are
# attributes of pyspark.sql.functions(.builtin) as in PySpark, used or not (F401), and of
# typing as there (UP035). E402: the imports follow the code that loads the generated module.
"python/pyspark/sql/functions.py" = ["F822", "F401", "UP035", "E402"]
# Re-export surfaces: the names are imported so that they resolve under PySpark's import
# paths, not because this module uses them (F401), and from typing as there (UP035).
"python/pyspark/sql/{types,streaming/query}.py" = ["F401", "UP035"]
# Fork-adapted copies of Apache Spark modules (upstream code with the Rust-backed parts
# swapped in). Only the correctness rules (F, E, W) apply; the import order, the typing and
# string-formatting idioms and the bugbear style stay as upstream writes them, so a diff
# against the pinned tag shows the adaptation and nothing else.
"python/pyspark/{__init__,find_spark_home,serializers,util}.py" = ["I", "UP", "B", "E402", "F401"]
"python/pyspark/errors/exceptions/connect.py" = ["I", "UP", "B"]
"python/pyspark/mllib/stat/__init__.py" = ["I", "UP", "B"]
"python/pyspark/pipelines/{api,spark_connect_graph_element_registry,spark_connect_pipeline}.py" = ["I", "UP", "B", "F401"]
"python/pyspark/resource/profile.py" = ["I", "UP", "B"]
"python/pyspark/sql/{__init__,tvf_argument,types,udf,udtf}.py" = ["I", "UP", "B"]
"python/pyspark/sql/connect/{context,datasource,expressions,sql_formatter,types,utils}.py" = ["I", "UP", "B"]
"python/pyspark/sql/streaming/{stateful_processor_api_client,transform_with_state_driver_worker}.py" = ["I", "UP", "B"]
"python/pyspark/streaming/{context,dstream,util}.py" = ["I", "UP", "B"]
"python/pyspark/testing/{connectutils,sqlutils}.py" = ["I", "UP", "B"]
# Keep the upstream Row implementation's implicit exception context and percent
# formatting so error behavior and source comparisons stay faithful to PySpark 4.3.0.
"crates/pyspark-rs/src/row.py" = ["B904", "UP031"]
# The upstream value classes format their reprs with percent formatting, as PySpark 4.3.0.
"crates/pyspark-rs/src/values.py" = ["UP031"]

[tool.maturin]
# Mixed Python/Rust layout: the pure-Python drop-in skin lives under python/pyspark,
# and the PyO3 extension is placed inside it as pyspark._pyspark.
python-source = "python"
module-name = "pyspark._pyspark"
manifest-path = "crates/pyspark-rs/Cargo.toml"
# The wheel auto-includes the license (as dist-info/licenses/LICENSE), but maturin
# does NOT pull the repo-root LICENSE into the sdist -- the crate lives under
# crates/pyspark-rs/, so a root-level file outside it is not packaged. The metadata
# still declares `License-File: LICENSE` in both artifacts, so PyPI (PEP 639) rejects
# the sdist with "License-File LICENSE does not exist in distribution file". Ship the
# LICENSE in the sdist so it satisfies the declared metadata. The same holds for NOTICE, which
# ASF releases carry next to LICENSE.
# The wheels also statically link the Rust dependencies. LICENSE-binary and NOTICE-binary
# (generated by scripts/gen_binary_licenses.py) list them with their licenses and notices.
# maturin declares the root LICENSE* and NOTICE* files as License-File of both artifacts, so
# the sdist ships the two binary files too, or PyPI rejects it.
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
    { path = "LICENSE-binary", format = "sdist" },
    { path = "NOTICE-binary", format = "sdist" },
]
# Use abi3 for a stable ABI compatible across Python 3.9+.
features = ["pyo3/abi3-py39", "pyo3/extension-module"]
# Keep tests out of the built wheel/sdist: our own offline suite lives outside the package
# (python/tests), but the vendored pyspark tree carries upstream test modules
# (e.g. pyspark/pipelines/tests, pyspark/testing/tests) that end users don't need.
exclude = [
    "python/pyspark/**/tests/**",
    "python/pyspark/**/test_*.py",
    "pyspark/**/tests/**",
    "pyspark/**/test_*.py",
]
