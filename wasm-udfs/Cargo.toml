[package]
name = "wasm-udfs"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# `cdylib` for the `wasm32` build (exports the UDF functions); `rlib` so the
# host build can call the generated `<name>_udf(..)` constructors.
crate-type = ["cdylib", "rlib"]

[dependencies]
spark-connect-macros = { package = "apache-spark-connect-macros", path = "../crates/spark-connect-macros", version = "4.2.0" }

# Only needed by the host-side constructors the macro generates; never compiled
# into the `wasm32` module (Spark Connect's gRPC stack does not target wasm).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spark-connect = { package = "apache-spark-connect", path = "../crates/spark-connect", version = "4.2.0" }

[profile.release]
opt-level = "s"
lto = true
