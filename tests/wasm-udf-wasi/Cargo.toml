# Fixture UDFs compiled for `wasm32-wasip1`, whose runner gives them the Python
# worker's environment, and the tests that run them: through the runners the packer
# ships, and end to end on a Spark Connect server that has `spark.pythonWorkerEnv.*`.
[package]
name = "wasm-udf-wasi-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
spark-connect-macros = { package = "apache-spark-connect-macros", path = "../../crates/spark-connect-macros" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spark-connect = { package = "apache-spark-connect", path = "../../crates/spark-connect", features = ["wasm-udf"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The same UDF compiled for wasm32-unknown-unknown, to compare with.
wasm-udf-tests = { path = "../wasm-udf" }

[build-dependencies]
spark-connect-build = { package = "apache-spark-connect-build", path = "../../crates/spark-connect-build" }
spark-connect-macros = { package = "apache-spark-connect-macros", path = "../../crates/spark-connect-macros" }
