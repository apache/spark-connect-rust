[workspace]
resolver = "2"
members = [
    "crates/spark-connect-proto",
    "crates/spark-connect-core",
    "crates/spark-connect",
    "crates/spark-connect-macros",
    "crates/spark-connect-build",
    "crates/pyspark-rs",
    "examples",
    "crates/spark-connect-server",
    "crates/spark-connect-server/jni",
]
exclude = [
    "examples/wasm-udfs",
    "examples/wasm-udf-inline",
    "tests/wasm-udf",
]
# `pyspark-rs` (the CPython extension cdylib, built via maturin) and the
# Rust-native `examples` crate both link the pure-Rust core directly; both are
# workspace members but excluded from `default-members` so `cargo test`/`cargo build`
# stay clean. Build them explicitly (`cargo build -p pyspark-rs` / `-p examples`).
#
# The `examples/wasm-udfs`, `examples/wasm-udf-inline` and `tests/wasm-udf` crates
# are excluded from the workspace entirely because they require the
# `wasm32-unknown-unknown` target, which may not be installed on every machine
# (so workspace commands do not require that target). Build them explicitly with
# `cargo build --manifest-path examples/wasm-udfs/Cargo.toml` (etc) in CI or when
# the target is installed locally.
# The experimental Rust server and JNI host are also opt-in. Build them with
# `cargo build -p spark-connect-server` or `cargo build -p spark-connect-jni`;
# workspace builds/tests/lint include the JNI host and need macOS/Linux with
# JAVA_HOME pointing to a JDK 21 installation. On Windows or without a JDK,
# use `--workspace --exclude spark-connect-jni`.
default-members = [
    "crates/spark-connect-proto",
    "crates/spark-connect-core",
    "crates/spark-connect",
    "crates/spark-connect-macros",
    "crates/spark-connect-build",
]

[workspace.package]
version = "4.3.0"
edition = "2021"
# The minimum Rust that the dependencies of the published crates need: tonic, tonic-prost and
# tonic-build 0.14 declare 1.88 (the `datafusion` feature needs 1.94, see below). CI checks it.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/apache/spark-connect-rust"
homepage = "https://spark.apache.org/"
authors = ["Apache Spark <dev@spark.apache.org>"]

# Lints shared by every workspace crate (each one sets `lints.workspace = true`). CI runs
# `cargo clippy --workspace --all-targets -- -D warnings`, so anything clippy reports fails the
# build. The lints below are allowed here, once, because this codebase triggers them by design;
# a targeted `#[allow]` elsewhere needs a comment saying why.
[workspace.lints.clippy]
# Public functions mirror PySpark signatures (`csv(...)`, `applyInPandas(...)`), whose
# parameter lists are long.
too_many_arguments = "allow"
# `SparkError` carries a `tonic::Status` and is the error type of the whole public API;
# boxing it would change that API.
result_large_err = "allow"
# Protobuf messages have many optional fields: `let mut m = Msg::default(); m.field = ...;`
# is the idiomatic way to fill a prost message, and reads better than nested struct updates.
field_reassign_with_default = "allow"
# `Column::add`/`sub`/`not`/... and `SaveMode::from_str` are public methods named after their
# PySpark counterparts; the matching `std::ops` traits are implemented alongside them.
should_implement_trait = "allow"

[workspace.dependencies]
# gRPC / protobuf.
tonic = { version = "0.14" }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-build = "0.14"
prost = "0.14"
prost-types = "0.14"

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-stream = "0.1"
futures = "0.3"
h2 = "0.4"

# Arrow (result decoding).
arrow = { version = "59", default-features = false, features = ["ipc", "ipc_compression", "prettyprint"] }

# DataFusion for the optional to_datafusion() conversion.
# Pinned to 55 for arrow 59 compatibility. 55 needs Rust 1.94, so only the `datafusion` feature
# needs that much; no DataFusion release is on Arrow 60 yet.
datafusion = { version = "55", default-features = false }

# Polars for the optional to_polars() conversion. Bridged via Arrow IPC bytes
# (the `ipc` feature) rather than the polars-arrow/`arrow_rs` path, so polars'
# vendored arrow need not match our arrow-rs version.
polars = { version = "0.54", default-features = false, features = ["ipc"] }

# PyO3 for the pyspark-rs CPython extension.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

# misc
bytes = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
libc = "0.2"
cc = "1"
