[workspace]
resolver = "2"
members = [
    "crates/spark-connect-proto",
    "crates/spark-connect-core",
    "crates/spark-connect",
    "crates/spark-connect-macros",
    "crates/spark-connect-build",
    "crates/pyspark-rs",
    "examples",
]
exclude = [
    "examples/wasm-udfs",
    "examples/wasm-udf-inline",
]
# `pyspark-rs` (the CPython extension cdylib, built via maturin) and the
# Rust-native `examples` crate both link the pure-Rust core directly; both are
# workspace members but excluded from `default-members` so `cargo test`/`cargo build`
# stay clean. Build them explicitly (`cargo build -p pyspark-rs` / `-p examples`).
#
# The `examples/wasm-udfs` and `examples/wasm-udf-inline` crates are excluded from
# the workspace entirely because they require the `wasm32-unknown-unknown` target,
# which may not be installed on every machine (so `cargo test --workspace` stays
# green without it). Build them explicitly with
# `cargo build --manifest-path examples/wasm-udfs/Cargo.toml` (etc) in CI or when
# the target is installed locally.
default-members = [
    "crates/spark-connect-proto",
    "crates/spark-connect-core",
    "crates/spark-connect",
    "crates/spark-connect-macros",
    "crates/spark-connect-build",
]

[workspace.package]
version = "4.3.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/apache/spark-connect-rust"
homepage = "https://spark.apache.org/"
authors = ["Apache Spark <dev@spark.apache.org>"]

[workspace.dependencies]
# gRPC / protobuf.
tonic = { version = "0.14" }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-stream = "0.1"
futures = "0.3"

# Arrow (result decoding).
arrow = { version = "58", default-features = false, features = ["ipc", "prettyprint"] }

# DataFusion for the optional to_datafusion() conversion.
# Pinned to 53 for arrow 58 compatibility.
datafusion = { version = "53", default-features = false }

# Polars for the optional to_polars() conversion. Bridged via Arrow IPC bytes
# (the `ipc` feature) rather than the polars-arrow/`arrow_rs` path, so polars'
# vendored arrow need not match our arrow-rs version.
polars = { version = "0.54", default-features = false, features = ["ipc"] }

# PyO3 for the pyspark-rs CPython extension.
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39"] }

# misc
bytes = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
