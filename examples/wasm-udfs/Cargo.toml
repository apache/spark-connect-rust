# A reusable UDF crate: `#[spark_wasm_udf]` functions whose `<name>_udf()`
# constructors other crates can call. `build.rs` compiles this crate's own
# functions to wasm32 and embeds the module.
#
# No own `[workspace]` table: this crate is a path-dependency of the `examples`
# member, so it must resolve within the root workspace (which `exclude`s it from
# membership). It builds standalone via `--manifest-path` because it's excluded.
[package]
name = "wasm-udfs"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
spark-connect-macros = { package = "apache-spark-connect-macros", path = "../../crates/spark-connect-macros", version = "4.2.0" }

# Host-only: the macro-generated constructors (which need the `wasm-udf`
# feature). Never compiled for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spark-connect = { package = "apache-spark-connect", path = "../../crates/spark-connect", version = "4.2.0", features = ["wasm-udf"] }

[build-dependencies]
spark-connect-build = { package = "apache-spark-connect-build", path = "../../crates/spark-connect-build", version = "4.2.0" }
spark-connect-macros = { package = "apache-spark-connect-macros", path = "../../crates/spark-connect-macros", version = "4.2.0" }
