[package]
name = "pyspark-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 bindings exposing the Rust Spark Connect client as a drop-in pyspark package"
# The Python extension (cdylib) is distributed as a PyPI wheel, not on crates.io.
publish = false

[lib]
name = "_pyspark"
crate-type = ["cdylib"]

# Warnings are errors for this crate in every build (CI builds it via several workflows
# that don't all set RUSTFLAGS=-D warnings). `non_snake_case` stays allowed: these classes
# expose PySpark's camelCase public API verbatim (see the crate-level note in lib.rs).
[lints.rust]
warnings = "deny"
non_snake_case = "allow"

[dependencies]
spark-connect = { package = "apache-spark-connect", path = "../spark-connect" }
spark-connect-core = { package = "apache-spark-connect-core", path = "../spark-connect-core" }
spark-connect-proto = { package = "apache-spark-connect-proto", path = "../spark-connect-proto" }
pyo3.workspace = true
arrow.workspace = true
tokio.workspace = true
prost.workspace = true
tonic.workspace = true
serde_json = "1.0"
