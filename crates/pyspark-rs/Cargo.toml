[package]
name = "pyspark-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PyO3 bindings exposing the Rust Spark Connect client as a drop-in pyspark package"
# The Python extension (cdylib) is distributed as a PyPI wheel, not on crates.io.
publish = false

[lib]
name = "_pyspark"
crate-type = ["cdylib"]

# The clippy allow list is the workspace's. This crate's own lint levels (warnings are errors
# in every build; `non_snake_case` is allowed) are crate attributes at the top of src/lib.rs,
# because a manifest cannot both inherit the workspace table and add to it.
[lints]
workspace = true

[dependencies]
spark-connect = { package = "apache-spark-connect", path = "../spark-connect" }
spark-connect-core = { package = "apache-spark-connect-core", path = "../spark-connect-core" }
spark-connect-proto = { package = "apache-spark-connect-proto", path = "../spark-connect-proto" }
pyo3.workspace = true
arrow = { workspace = true, features = ["pyarrow"] }
tokio.workspace = true
# The drop-in decodes the protobufs that a pickled Column or DataFrame, and a session hook's
# request, carry, which PySpark's protobuf decodes at any depth: lift prost's limit of 100
# nested messages for this crate (the decode stacks are grown, see `on_grown_stack`).
prost = { workspace = true, features = ["no-recursion-limit"] }
prost-types.workspace = true
tonic.workspace = true
serde_json = "1.0"
stacker = "0.1"
