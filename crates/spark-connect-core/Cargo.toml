[package]
name = "apache-spark-connect-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Spark Connect client transport: gRPC channel, retries, reattach, artifacts, config, errors"

[lints]
workspace = true

[lib]
name = "spark_connect_core"

[dependencies]
spark-connect-proto = { package = "apache-spark-connect-proto", path = "../spark-connect-proto", version = "4.3.0" }
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"] }
prost.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-stream.workspace = true
futures.workspace = true
bytes.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
serde = "1"
serde_json = "1"
regex = "1"
zstd = "0.13"
prost-types.workspace = true
crc32fast = "1"
sha2 = "0.10"
# Transport errors that tonic keeps as a status's source, for `RetryPolicy::can_retry`.
h2 = "0.4"
hyper = "1"
# The tokio stream of a channel through a proxy, as tonic's own connector gives it to hyper.
hyper-util = { version = "0.1", features = ["tokio"] }
# Grows the stack for the clones and drops of the requests of deep plans.
stacker = "0.1"

[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
# sha2 0.10 requires this feature for ARM hardware acceleration; sha2-asm excludes Windows.
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
# A hyper HTTP/2 client connection, for a request that its connection closed before sending.
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3"
tonic-prost.workspace = true
