[package]
name = "apache-spark-connect-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Spark Connect client transport: gRPC channel, retries, reattach, artifacts, config, errors"

[lints]
workspace = true

[lib]
name = "spark_connect_core"

[dependencies]
spark-connect-proto = { package = "apache-spark-connect-proto", path = "../spark-connect-proto", version = "4.4.0" }
tonic.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
futures.workspace = true
bytes.workspace = true
uuid.workspace = true
tracing.workspace = true
serde = "1"
serde_json = "1"
regex = "1"
zstd = "0.13"
prost-types.workspace = true
crc32fast = "1"
sha2 = "0.10"
# Transport errors that tonic keeps as a status's source, for `RetryPolicy::can_retry`.
h2.workspace = true
hyper = "1"
# The Basic credential and the percent-decoded userinfo of a proxy URI, already built for tonic.
base64 = "0.22"
percent-encoding = "2"
# The tokio stream of the connections of the connector, as tonic's own connector gives it to hyper.
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
# Grows the stack for the clones and drops of the requests of deep plans.
stacker = "0.1"
# The TLS sessions of the channels, which the connector makes itself, as tonic's own TLS (its
# `tls-ring` and `tls-native-roots` features, which the client does not use) makes them, so that the
# settings of a TLS server are bounded by the connect deadline and its failures have grpcio's texts.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-native-certs = "0.8"

[target.'cfg(unix)'.dependencies]
# The texts of `gai_strerror`, which tell the failures of the system's resolver apart.
libc = "0.2"

[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
# sha2 0.10 requires this feature for ARM hardware acceleration; sha2-asm excludes Windows.
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
# The gRPC servers of the tests.
tonic = { workspace = true, features = ["server", "router"] }
# The paused clock of the tests of the backoff of the connections.
tokio = { workspace = true, features = ["test-util"] }
# The certificates and the keys of the TLS servers of the tests, made as the tests run, so that
# no key is kept in the source; of ring, which rustls builds on here.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tempfile = "3"
tonic-prost.workspace = true
