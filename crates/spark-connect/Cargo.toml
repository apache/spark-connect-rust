[package]
name = "apache-spark-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Pure-Rust Spark Connect DataFrame client mirroring the PySpark API surface"

[lib]
name = "spark_connect"

[dependencies]
spark-connect-proto = { package = "apache-spark-connect-proto", path = "../spark-connect-proto", version = "4.2.0" }
spark-connect-core = { package = "apache-spark-connect-core", path = "../spark-connect-core", version = "4.2.0" }
prost.workspace = true
arrow.workspace = true
bytes.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json = "1.0"
uuid.workspace = true

# Optional: only pulled in by the `wasm-udf` feature.
base64 = { version = "0.21", optional = true }

# Optional conversion features (off by default).
datafusion = { workspace = true, optional = true }
polars = { workspace = true, optional = true }

[dev-dependencies]
base64 = "0.21"

[features]
# Run Rust UDFs on Spark via WebAssembly (the `wasm_udf` module). Off by
# default: only UDF users pay for the extra dependency and the runtime
# preconditions (a Python packer on the client, `wasmtime` on the executors).
wasm-udf = ["dep:base64"]
# Convert a collected DataFrame into a datafusion::dataframe::DataFrame.
datafusion = ["dep:datafusion"]
# Convert a collected DataFrame into a polars::frame::DataFrame.
polars = ["dep:polars"]
