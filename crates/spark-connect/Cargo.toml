[package]
name = "apache-spark-connect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Pure-Rust Spark Connect DataFrame client mirroring the PySpark API surface"

[lints]
workspace = true

[lib]
name = "spark_connect"

[dependencies]
spark-connect-proto = { package = "apache-spark-connect-proto", path = "../spark-connect-proto", version = "4.4.0" }
spark-connect-core = { package = "apache-spark-connect-core", path = "../spark-connect-core", version = "4.4.0" }
prost.workspace = true
prost-types.workspace = true
arrow.workspace = true
bytes.workspace = true
tokio.workspace = true
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# The shortest digits of a float, of round-half-even ties, as Python's `repr` writes them.
ryu = "1"
# Local time for the reprs of timestamp literals, as Python's `datetime.fromtimestamp`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid.workspace = true
# Grows the stack on demand while an expression of many levels is serialized or rendered.
stacker = "0.1"
# Finds the type URL of the placeholders of DataFrames in the encodings of the plans built outside
# the core (`memmem`, of 2.4); the core's dependencies build it already.
memchr = "2.4"

# Optional: only pulled in by the `wasm-udf` feature.
base64 = { version = "0.22", optional = true }

# Optional conversion features (off by default).
datafusion = { workspace = true, optional = true }
polars = { workspace = true, optional = true }

[dev-dependencies]
base64 = "0.22"
futures.workspace = true
# The gRPC servers of the tests.
tonic = { workspace = true, features = ["server", "router"] }
# The tests decode the relations of the placeholders of deep DataFrames, as the drop-in does,
# whose `pyspark-rs` lifts prost's limit of 100 nested messages: so do the tests. The responses of
# the client keep the limit, which the codec of the client checks itself.
prost = { workspace = true, features = ["no-recursion-limit"] }

[features]
# Run Rust UDFs on Spark via WebAssembly (the `wasm_udf` module). Off by
# default: only UDF users pay for the extra dependency and the runtime
# preconditions (a Python packer on the client, `wasmtime` on the executors).
wasm-udf = ["dep:base64"]
# Convert a collected DataFrame into a datafusion::dataframe::DataFrame.
datafusion = ["dep:datafusion"]
# Convert a collected DataFrame into a polars::frame::DataFrame.
polars = ["dep:polars"]
