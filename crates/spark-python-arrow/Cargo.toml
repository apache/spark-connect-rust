[package]
name = "spark-python-arrow"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Arrow record batch export to PyArrow for Spark clients"
repository = "https://github.com/apache/spark-connect-rust"

[dependencies]
arrow = { version = "58", default-features = false, features = ["ffi", "ipc"] }
# The consumer chooses the Python ABI floor and embedding/extension-module linking.
pyo3 = { version = "0.28" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
