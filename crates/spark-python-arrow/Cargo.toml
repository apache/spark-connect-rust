# SPDX-License-Identifier: Apache-2.0
[package]
name = "spark-python-arrow"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Arrow and Python conversion shared by Spark clients and Python workers"
repository = "https://github.com/apache/spark-connect-rust"

[dependencies]
arrow = { version = "58", default-features = false, features = ["ffi", "ipc"] }
# The consumer chooses the Python ABI floor and embedding/extension-module linking.
pyo3 = { version = ">=0.28, <0.30" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
