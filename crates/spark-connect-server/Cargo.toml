[package]
name = "spark-connect-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Experimental Spark Connect server frontend for an embedded Spark JVM engine"

[lints]
workspace = true

[dependencies]
spark-connect-proto = { package = "apache-spark-connect-proto", path = "../spark-connect-proto" }
arrow.workspace = true
futures.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true
tonic-prost.workspace = true
uuid.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
h2.workspace = true
spark-connect = { package = "apache-spark-connect", path = "../spark-connect" }
